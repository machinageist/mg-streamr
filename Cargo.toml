[package]
name = "mg-streamr"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Music and podcasts on mpd for the Geist suite: CLI, TUI and the shell's Media panel"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
dirs = "5"
# feeds and downloads go through mg-brief's guarded network path (one hardened path for the suite)
mg-brief = { path = "../mg-briefr" }
# the version mg-brief links; two would clash over libsqlite3
rusqlite = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "deny"
