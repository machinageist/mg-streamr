[package]
name = "mg-streamr"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Music and podcasts on mpd for the Geist suite: CLI, TUI and the shell's Media panel"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "deny"
